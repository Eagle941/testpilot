format_version = 1
input_file = "scenario.csv"

# Optional actual aircraft mass/balance targets. Readback is implemented, but
# submission is a safe TODO stub: detected A32NX aircraft currently fail on arming;
# unsupported or unidentified aircraft skip initialisation and start replay.
# [initialisation]
# zfw = 60000.0 # kg
# gw = 65000.0  # kg
# gwcg = 25.0  # percent MAC

[inject.0]
name = "sidestick_pitch_position"
variable = "K:AXIS_ELEVATOR_SET"
source_range = [-25.0, 25.0]
simulator_range = [-16383.0, 16384.0]

[inject.1]
name = "sidestick_roll_position"
variable = "K:AXIS_AILERONS_SET"
source_range = [-25.0, 25.0]
simulator_range = [-16383.0, 16384.0]

[record.0]
name = "pitch"
variable = "A:PLANE PITCH DEGREES"
unit = "radians"

[record.1]
name = "roll"
variable = "A:PLANE BANK DEGREES"
unit = "radians"

[record.2]
name = "elevator_position"
variable = "A:ELEVATOR POSITION"
unit = "position"

[record.3]
name = "aileron_position"
variable = "A:AILERON POSITION"
unit = "position"
