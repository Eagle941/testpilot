format_version = 1
input_file = "scenario.csv"

# Optional initialisation: zfw/gw/gwcg must be all present or all absent.
# ths is independently optional; ths-only and mass/balance-only runs are valid.
# Detected A32NX aircraft apply these and wait for readiness; unsupported or
# unidentified aircraft skip initialisation and start replay.
# [initialisation]
# zfw = 60000.0 # kg
# gw = 65000.0  # kg
# gwcg = 25.0  # percent MAC
# ths = 1.0    # optional degrees, -4 to 13.5 inclusive

[inject.0]
name = "sidestick_pitch_position"
variable = "K:AXIS_ELEVATOR_SET"
source_range = [-25.0, 25.0]
simulator_range = [-16383.0, 16384.0]

[inject.1]
name = "sidestick_roll_position"
variable = "K:AXIS_AILERONS_SET"
source_range = [-25.0, 25.0]
simulator_range = [-16383.0, 16384.0]

[record.0]
name = "pitch"
variable = "A:PLANE PITCH DEGREES"
unit = "radians"

[record.1]
name = "roll"
variable = "A:PLANE BANK DEGREES"
unit = "radians"

[record.2]
name = "elevator_position"
variable = "A:ELEVATOR POSITION"
unit = "position"

[record.3]
name = "aileron_position"
variable = "A:AILERON POSITION"
unit = "position"
