[workspace]
resolver = "3"
members = ["crates/testpilot", "crates/testpilot-core", "crates/testpilot-msfs", "crates/testpilot-a32nx"]
default-members = ["crates/testpilot", "crates/testpilot-core", "crates/testpilot-msfs", "crates/testpilot-a32nx"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
testpilot-core = { path = "crates/testpilot-core" }
testpilot-msfs = { path = "crates/testpilot-msfs" }
testpilot-a32nx = { path = "crates/testpilot-a32nx" }
anyhow = "1"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["std"] }
thiserror = "2"
toml = "0.8"
criterion = "0.5"
msfs = { git = "https://github.com/flybywiresim/msfs-rs", rev = "2f697b9aac9fa3c00474f901a7f7ee4218cf534b" }

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = true
strip = true
